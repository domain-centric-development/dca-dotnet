name: Release

# Independent versions: tag `building-blocks/vX.Y.Z` publishes DomainCentric.BuildingBlocks,
# tag `archrules/vX.Y.Z` publishes DomainCentric.ArchRules + DomainCentric.ArchRules.Xunit.
on:
  push:
    tags:
      - 'building-blocks/v*'
      - 'archrules/v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve project and version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#*/v}"
          case "$TAG" in
            building-blocks/*) PROJECTS="src/DomainCentric.BuildingBlocks/DomainCentric.BuildingBlocks.csproj" ;;
            archrules/*)       PROJECTS="src/DomainCentric.ArchRules/DomainCentric.ArchRules.csproj src/DomainCentric.ArchRules.Xunit/DomainCentric.ArchRules.Xunit.csproj" ;;
            *) echo "unknown tag prefix: $TAG" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
      - run: dotnet build
      - run: dotnet test --no-build
      - name: Pack
        run: |
          for p in ${{ steps.tag.outputs.projects }}; do
            dotnet pack "$p" -c Release -o artifacts -p:Version=${{ steps.tag.outputs.version }}
          done
      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
